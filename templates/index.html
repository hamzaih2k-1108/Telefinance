<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Boursier en Direct</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: #1a3e6f;
            color: white;
            padding: 15px 0;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        .video-wrapper {
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background-color: #2c5282;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
        }
        .update-info {
            font-style: italic;
            color: #666;
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
        }
        .error-message {
            color: #e53e3e;
            background-color: #fed7d7;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
            display: none;
        }
        .video-controls {
            margin-top: 10px;
            text-align: center;
        }
        button {
            background-color: #2b6cb0;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2c5282;
        }
        .refresh-info {
            color: #666;
            text-align: center;
            font-size: 13px;
            margin-top: 5px;
            font-style: italic;
        }
        .video-status {
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
            color: #2c5282;
        }
    </style>
</head>
<body>
        <header>
            <div class="container" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                <h1><b>Télé-finance - ID&amp;A Tech</b></h1>
            </div>
    </header>
    
    <div class="container">
        <div class="video-wrapper">
            <div class="video-container">
                <video id="videoPlayer" controls autoplay muted loop style="width:100%;height:100%;object-fit:cover;">
                    <source id="videoSource" src="/video/" type="video/mp4">
                    Votre navigateur ne supporte pas la lecture de vidéos HTML5.
                </video>
            </div>
        </div>
        
        <div id="videoStatus" class="video-status">Chargement de la vidéo...</div>
        
        <div class="video-controls">
            <button id="refreshBtn">Rafraîchir maintenant</button>
            <button id="fullscreenBtn">Plein écran</button>
        </div>

        
        <div class="update-info">
            Le flux se met à jour automatiquement toutes les 3 minutes
        </div>
        <div class="refresh-info" id="refreshInfo"></div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const videoSource = document.getElementById('videoSource');
        const countdownElement = document.getElementById('countdown');
        const lastUpdateElement = document.getElementById('lastUpdate');
        const refreshBtn = document.getElementById('refreshBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const errorMessage = document.getElementById('errorMessage');
        const videoStatusElement = document.getElementById('videoStatus');

        let countdown = 180;
        let currentVideo = null;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function updateVideoStatus(type) {
            currentVideo = type;
            videoStatusElement.textContent = type === 'output' 
                ? "En cours : Vidéo principale" 
                : "En cours : Vidéo d'introduction";
        }

        function updateLastUpdateTime() {
            fetch('/status/')
                .then(res => res.json())
                .then(data => {
                    lastUpdateElement.textContent = data.last_update;
                })
                .catch(err => console.error("Error fetching status:", err));
        }

        function switchVideo(newSrc, type) {
            if (currentVideo === type) return;
            
            videoSource.src = newSrc;
            videoPlayer.load();
            videoPlayer.play()
                .then(() => {
                    updateVideoStatus(type);
                    hideError();
                    updateLastUpdateTime();
                })
                .catch(err => {
                    console.warn("Autoplay error:", err);
                    showError("La lecture automatique a échoué. Cliquez sur le bouton play pour démarrer la vidéo.");
                });
        }

        function checkVideoStatus() {
            fetch('/status/')
                .then(res => res.json())
                .then(data => {
                    if (data.video_exists) {
                        if (currentVideo !== 'output') {
                            switchVideo(`/video/?t=${Date.now()}`, 'output');
                        }
                    } else {
                        if (currentVideo !== 'intro') {
                            switchVideo('/video/', 'intro');
                        }
                    }
                })
                .catch(err => {
                    console.error("Error checking video status:", err);
                    if (!currentVideo) {
                        switchVideo('/video/', 'intro');
                    }
                });
        }

        function startCountdown() {
            setInterval(() => {
                countdown--;
                countdownElement.textContent = formatTime(countdown);
                if (countdown <= 0) {
                    countdown = 180;
                    checkVideoStatus();
                }
            }, 1000);
        }

        refreshBtn.addEventListener('click', () => {
            countdown = 180;
            checkVideoStatus();
        });

        fullscreenBtn.addEventListener('click', () => {
            if (videoPlayer.requestFullscreen) {
                videoPlayer.requestFullscreen();
            } else if (videoPlayer.webkitRequestFullscreen) {
                videoPlayer.webkitRequestFullscreen();
            } else if (videoPlayer.msRequestFullscreen) {
                videoPlayer.msRequestFullscreen();
            }
        });

        videoPlayer.addEventListener('error', () => {
            showError("Erreur de chargement vidéo. Retour à la vidéo d'introduction...");
            setTimeout(() => switchVideo('/video/', 'intro'), 1000);
        });

        // Initialisation
        videoPlayer.loop = true;
        switchVideo('/video/', 'intro');
        startCountdown();
        setInterval(checkVideoStatus, 5000);
    </script>
</body>
</html>
